# cproxy production run config (replaces the hand-typed docker run). Lives at /opt/cproxy/compose.yml
# on the droplet; redeploy = docker compose -f /opt/cproxy/compose.yml up -d
# Only private VPC addresses appear here; the public edge is restricted by cproxy-firewall.service.
services:
  cproxy:
    image: ghcr.io/balintomsk/cproxy@sha256:fa491894ef517b53d7c25d4b462597ad325ca26af47de6058063530205f125af  # 0.13.0 pinned by digest
    container_name: cproxy
    restart: unless-stopped
    ports:
      - "80:8080"                                        # public edge; inbound restricted by cproxy-firewall.service (DOCKER-USER allowlist)
    environment:
      # CPROXY_DOCAPI_UPSTREAM is deliberately NOT set here. This repo is public, so the docapi VPC
      # address cannot live in a tracked file — and this file is deployed VERBATIM to
      # /opt/cproxy/compose.yml, so a <placeholder> here is not documentation, it is an outage:
      # cproxy would try to resolve the literal placeholder and answer every /api/* call with 502.
      # (That is exactly what happened on 2026-09-02.) The real value is supplied by the dotenv on
      # the volume, /mnt/volume_cnode/cproxy/.env, alongside EXTERNAL_ADMIN / EXTERNAL_FRONTEND.
      # A real process env var would win over the dotenv, which is why this must stay unset.
      CPROXY_ROUTE_PREFIX: /api/
      CPROXY_ALLOWED_METHODS: GET,POST,PATCH             # POST and PATCH are both gated by the Bearer JWT below, not open
      CPROXY_DAYKEY_DB: /etc/cproxy/daykeys.sqlite        # per-day rotating key the JWT's `server` claim must match (see DayKeyStore)
      CPROXY_DOTENV_PATH: /etc/cproxy/.env
      FF_MASTER_KEY_FILE: /etc/cproxy/master.key
      # Datacenter/cloud-provider blocking. The path MUST be on a writable bind mount: the rootfs is
      # read_only and the refresher rewrites this database in place every fortnight.
      CPROXY_CLOUDRANGE_DB: /var/lib/cproxy/cloudranges.sqlite
      # Only ever "true" while /mnt/volume_cnode/cproxy/.env carries BOTH
      # CPROXY_RABBITMQ_MANAGEMENT_URL and CPROXY_RABBITMQ_PASSWORD. Enabling it without them is
      # FATAL at startup (validate_config rejects an empty management URL), which takes the whole
      # proxy down, not just the mirror -- that is exactly what happened on the first 0.9.2 deploy,
      # before those two keys were added to the dotenv. Check the dotenv before flipping this back.
      CPROXY_RABBITMQ_EVENTS_ENABLED: "true"
      # CPROXY_RABBITMQ_MANAGEMENT_URL is deliberately NOT set here, same reason as
      # CPROXY_DOCAPI_UPSTREAM above: this repo is public and this file deploys VERBATIM, so a
      # <placeholder> would not be documentation, it would be an outage the moment the RabbitMQ
      # consumer tried to resolve it. The real value (like CPROXY_RABBITMQ_PASSWORD) comes from
      # /mnt/volume_cnode/cproxy/.env.
      CPROXY_RABBITMQ_USERNAME: fishfind
      # CPROXY_RABBITMQ_PASSWORD is secret and must come from /mnt/volume_cnode/cproxy/.env.
      CPROXY_RABBITMQ_QUEUE: fishfind.account.events
      CPROXY_ACCOUNT_MIRROR_DB: /var/lib/cproxy/auth.sqlite
      # Gateway JWT (0.10.0). CPROXY_JWT_SECRET is secret and comes from the volume's .env, same as
      # the two above -- it must equal FishApi:JwtKey in the frontend's secrets.config byte for byte.
      #
      # A signed token is the ONLY credential for the gated surface. Every caller presents
      # Authorization: Bearer <token>, and the day-key is read from the token's `server` claim; for a
      # human that means Profile -> Gateway token -> Save jwt.txt on the portal. The bare X-Day-Guid
      # header was refused from 2026-09-09 (CPROXY_JWT_REQUIRED=true) and the code that could accept
      # it was REMOVED in 0.13.0 (2026-09-11), together with CPROXY_JWT_REQUIRED itself -- so there is
      # no config-only rollback to the header any more. Do not add CPROXY_JWT_REQUIRED back: 0.13.0
      # ignores it and logs a WARN. Going back to the header means redeploying the 0.12.0 digest.
      # If CPROXY_JWT_SECRET is ever missing from the dotenv, every gated request answers 500
      # (startup logs an ERROR saying so); ungated reads keep serving.
      #
      # The `user` claim is now enforced too (2026-09-09): a POST/PATCH must carry one, and any claim
      # present -- on a read as well -- must resolve to a live, non-suspended, non-deleted, unexpired
      # account in the RabbitMQ mirror. A gated READ with NO claim is still allowed, because
      # /news/featured and /news/more are the public home page and the gate there is against
      # anonymous scraping, not anonymous reading.
      #
      # This was blocked until the mirror actually had data. It was empty for two independent
      # reasons, both silent: TR_Users_Prime_SyncOutbox postdates every existing account (fixed by
      # dbo.sp_user_prime_sync_backfill), and the dispatcher's prime stream was broken under Windows
      # PowerShell 5.1. Mirror now holds 1095 user_prime_sync rows / 3 accounts.
      #
      # BEFORE CHANGING THIS, read the startup line "user-prime store loaded" and check `accounts` is
      # non-zero. The store fails CLOSED -- an empty or unreadable mirror refuses every write and
      # every signed-in read, with only an opaque 500 to show for it. Rollback is setting this to
      # "false" and re-running compose up -d.
      CPROXY_JWT_REQUIRE_USER: "true"
      #
      # Clock-skew allowance on exp/iat, tightened from the compiled default of 300 (2026-09-10, at
      # the user's request). Measured skew between this droplet and the frontend at the time was
      # ~2 seconds, so 60 leaves a 30x margin; the wider default existed only because nothing used
      # to notice or repair drift, which CPROXY_JWT_CLOCK_SYNC below now does.
      #
      # Note what this number is NOT: the day-key `server` claim and the `user` claim's day_year
      # each accept a yesterday/today/tomorrow window, so the day rollover tolerates +/-1 day
      # regardless. This leeway is the binding constraint on the two clocks agreeing.
      CPROXY_JWT_LEEWAY_SECONDS: "60"
      #
      # Self-repair for the above (0.11.0; admin lookup 0.12.0). A request carrying BOTH a token
      # from an admin ACCOUNT AND an X-Client-Time header may correct this process's clock offset
      # when the two disagree by more than the threshold. "Admin" is decided HERE, from the RabbitMQ
      # account mirror (users_sync.access == 255, looked up by the token's `user` product) -- the
      # token carries no role, and an `adm` claim from an older frontend is ignored. Only the
      # offset moves -- never the droplet's clock, which the container could not set anyway under
      # cap_drop: ALL (see src/clock_offset.hpp).
      #
      # The ceiling is the security bound: a replayed admin token would need to move the clock ~24h
      # to make its stale day-key current again, and this refuses anything past an hour. Set
      # CPROXY_JWT_CLOCK_SYNC=false to pin the host clock permanently -- no rebuild, no image change.
      CPROXY_JWT_CLOCK_SYNC: "true"
      CPROXY_JWT_CLOCK_SYNC_THRESHOLD_SECONDS: "5"
      CPROXY_JWT_CLOCK_SYNC_MAX_SECONDS: "3600"
      #   issuer/audience/subject       -- envfish / fishfind.info / cproxy, which is what the
      #                                    frontend mints; writing them here would just be a second
      #                                    place to keep in sync.
      # CPROXY_CLOUDRANGE_REFRESH_ON_START is intentionally NOT set. It was on for the first deploy
      # only, to populate the database immediately instead of waiting out the 336h timer. The
      # database lives on the volume and survives redeploys, so leaving it on would just re-pull
      # ~92k prefixes from twelve third-party feeds on every container restart.
      # Exempt addresses are NOT listed here - this file is tracked in a public repo. EXTERNAL_ADMIN
      # and EXTERNAL_FRONTEND are exempt automatically; anything else goes in the encrypted .env as
      # CPROXY_CLOUDRANGE_EXEMPT_IPS.
    volumes:
      - /mnt/volume_cnode/cproxy/.env:/etc/cproxy/.env:ro
      - /mnt/volume_cnode/cproxy/master.key:/etc/cproxy/master.key:ro
      - /mnt/volume_cnode/cproxy/daykeys/daykeys.sqlite:/etc/cproxy/daykeys.sqlite:ro  # own folder, same volume as logs
      - /mnt/volume_cnode/cproxy/logs:/var/log/cproxy    # rolling logs persist on volume-cnode
      - /mnt/volume_cnode/cproxy/cloudranges:/var/lib/cproxy  # rw: the refresher rewrites range + account mirror dbs here
    read_only: true                                      # binary writes only to the two rw bind mounts
    cap_drop: [ALL]                                      # binds unprivileged 8080 in-container; needs no capabilities
    security_opt:
      - no-new-privileges:true


